<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Escolha uma moldura, coloque sua foto e mostre seu apoio a Júlio César 555.">
  <title>Tô com Júlio César 555</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="brand">
      <span class="brand-copy">TÔ COM</span>
      <strong>JÚLIO <em>CÉSAR</em></strong>
      <span class="number">555</span>
    </header>
    <section class="editor" aria-labelledby="pageTitle">
      <div class="intro">
        <p class="eyebrow">MOSTRE SEU APOIO</p>
        <h1 id="pageTitle">Escolha sua moldura</h1>
        <p>Coloque sua foto, ajuste e baixe.</p>
      </div>
      <div class="format-tabs" role="group" aria-label="Formato da imagem">
        <button class="format-tab active" type="button" data-format="story" aria-pressed="true">Story</button>
        <button class="format-tab" type="button" data-format="feed" aria-pressed="false">Feed</button>
      </div>
      <div class="preview-row">
        <button class="nav-button" id="previousFrame" type="button" aria-label="Moldura anterior">‹</button>
        <div class="canvas-shell" id="canvasShell">
          <canvas id="editorCanvas" width="1080" height="1920" aria-label="Prévia da foto com a moldura escolhida"></canvas>
          <button class="empty-action" id="emptyAction" type="button"><span class="plus">+</span><strong>Adicionar foto</strong></button>
        </div>
        <button class="nav-button" id="nextFrame" type="button" aria-label="Próxima moldura">›</button>
      </div>
      <div class="frame-status">
        <span id="frameName">Moldura 1</span>
        <div class="dots" id="frameDots" aria-label="Escolha uma moldura"></div>
      </div>
      <input id="photoInput" type="file" accept="image/*" hidden>
      <div class="photo-controls" id="photoControls" hidden>
        <label for="zoomRange"><span>Ajuste o tamanho</span><output id="zoomValue">100%</output></label>
        <input id="zoomRange" type="range" min="100" max="300" value="100">
        <p>Arraste a foto na moldura para posicionar.</p>
      </div>
      <div class="actions">
        <button class="secondary-button" id="photoButton" type="button">Escolher foto</button>
        <button class="primary-button" id="downloadButton" type="button" disabled>Baixar imagem</button>
      </div>
      <button class="reset-button" id="resetButton" type="button" hidden>Centralizar foto</button>
      <p class="privacy">Sua foto fica somente no seu aparelho.</p>
    </section>
    <footer>JÚLIO CÉSAR • SENADOR 555</footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
